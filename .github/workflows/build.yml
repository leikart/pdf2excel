name: 打包 Windows exe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: pip install pyinstaller pdfplumber openpyxl

      - name: 打包
        run: pyinstaller --onefile --windowed --name "PDF2Excel" --hidden-import pdfplumber --hidden-import pdfminer --hidden-import pdfminer.high_level --hidden-import pdfminer.layout --hidden-import openpyxl --hidden-import openpyxl.cell.cell --collect-all pdfplumber --collect-all pdfminer pdf2excel.py

      - uses: actions/upload-artifact@v4
        with:
          name: PDF2Excel-Windows
          path: dist/PDF2Excel.exe
          retention-days: 30
